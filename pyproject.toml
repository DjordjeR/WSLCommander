# Tooling configuration only — packaging is handled by WSLCommander.spec.

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",     # import sorting
    "UP",    # modern Python idioms (e.g. list[str] over typing.List)
    "SIM",   # simplifications
    "PLW",   # pylint warnings (unused vars, subprocess check=, ...)
    "RUF",
    "B",     # bugbear
]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",  # ambiguous unicode in strings/comments: prose uses – and ×
]
